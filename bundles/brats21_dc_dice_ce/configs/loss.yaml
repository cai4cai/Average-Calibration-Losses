##########################
# LOSS FUNCTION
##########################
lossfn:
  _target_: src.losses.DCLossandDiceCELoss
  dc_weight: 0.33
  dice_weight: 0.33
  ce_weight: 0.33
  to_onehot_y: true
  dc_params:
    n_points: 50
    include_background: true
    softmax: true
    reduction: 'mean'
  dice_params:
    include_background: true
    softmax: true
    reduction: 'mean'
    squared_pred: true
    smooth_nr: 0
    smooth_dr: 1.0e-05
  ce_params:
    reduction: 'mean'
